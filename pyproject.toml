[project]
name = "fingerprints-studio"
version = "0.2.0"
description = "Generic fingerprint modeling: learn any event dataset (tables, MX/MT messages, logs), recognize patterns, and generate anonymized synthetic data"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
sdv = ["sdv>=1.12", "pandas>=2.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools]
packages = ["fingerprints", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
